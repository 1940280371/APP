name: 编译枫叶影视APK

on:
  workflow_dispatch:
  push:
分支: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取本仓库（含我们的配置与脚本）
        uses: actions/checkout@v4

      - name: 2. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ===== 关键：准备 Python 3.8（Chaquopy 构建车轮需要，版本需与上游匹配） =====
      - name: 2.1 准备 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 3. 准备 Android SDK（用 runner 预装的）
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "SDK at: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true

      - name: 4. 克隆 CatVod 系源码（takagen99/Box）
        run: git clone --depth 1 https://github.com/takagen99/Box CatVod

      - name: 4.1 补写 local.properties（关键修复）
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > CatVod/local.properties
          echo "===== CatVod/local.properties ====="
          cat CatVod/local.properties

      # ===== 关键：修复上游写死的 Windows buildPython 路径 + 移除会导致失败的 pyquery 依赖 =====
      - name: 4.2 修复 buildPython 路径并移除 pyquery 依赖
        run: |
          FILE="CatVod/pyramid/build.gradle"
          if grep -n 'buildPython' "$FILE"; then
            sed -i -E 's#buildPython\("[^"]*"\)#buildPython("python3")#' "$FILE"
            echo "===== 修复后的 buildPython 行 ====="
            grep -n 'buildPython' "$FILE"
          else
            echo "未找到 buildPython，跳过"
          fi
          # pyquery 会拉入 cssselect>=1.5.0，而 Chaquopy 的 Android wheel 仓库里没有对应包，
          # 导致 generatePythonRequirements 失败；枫叶壳子基本用不到 pyquery，直接移除该行
          if grep -n 'install "pyquery"' "$FILE"; then
            sed -i '/install "pyquery"/d' "$FILE"
            echo "===== 已移除 pyquery 依赖 ====="
          else
            echo "未找到 pyquery，跳过"
          fi
          echo "===== pyramid 当前 pip 依赖 ====="
          grep -n 'install' "$FILE" || true

      - name: 5. 烧入枫叶配置
        run: bash fengye-catvod/bake.sh CatVod app

      - name: 5.1 构建环境诊断
        working-directory: CatVod
        run: |
          echo "===== gradle wrapper ====="
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo "===== AGP 版本 ====="
          grep -rh "com.android.tools.build:gradle" build.gradle build.gradle.kts 2>/dev/null | head -5 || true
          echo "===== settings.gradle ====="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null || true
          echo "===== 根目录 ====="
          ls -1

      - name: 6. 编译 Debug APK（日志同时存盘，方便下载）
        working-directory: CatVod
        run: |
          chmod +x gradlew
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          # Chaquopy 的 lxml 等带 C 扩展，若拉不到预编译 wheel 需要本机编译器兜底
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

          # 确认 python3 指向我们装的 3.8
          echo "===== python3 版本 ====="
          python3 --version

          # 自动找出真正的 application 模块（默认 :app）
          MODULE=":app"
          if ! grep -q "com.android.application" app/build.gradle app/build.gradle.kts 2>/dev/null; then
            for d in */; do
              if grep -q "com.android.application" "$d/build.gradle" "$d/build.gradle.kts" 2>/dev/null; then
                MODULE=":${d%/}"
                break
              fi
            done
          fi
          echo "使用模块: $MODULE"

          JVM_ARGS="-Xmx3g -XX:MaxMetaspaceSize=1g"

          echo "===== 开始编译（完整日志写入 build.log） ====="
          set +e
          ./gradlew "${MODULE}:assembleDebug" --no-daemon --stacktrace "-Dorg.gradle.jvmargs=$JVM_ARGS" 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "BUILD_RC=$BUILD_RC"
          exit $BUILD_RC

      - name: 7. 上传成品 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fengye-app-debug
          path: CatVod/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ===== 失败也不怕：自动把关键报错行捞出来，不用你翻 1000 行 =====
      - name: 8. 提取报错摘要（小白友好，只看这几行）
        if: always()
        working-directory: CatVod
        run: |
          echo "=========================================="
          echo "           报 错 摘 要（只看这里）"
          echo "=========================================="
          echo ""
          echo "--- 1) 关键报错行（FAILED / error / 异常 / 找不到包）---"
          grep -nE "FAILED|What went wrong|Exception in|error:|Could not find|Process completed with exit code|cssselect|pyquery|buildPython" build.log | tail -40 || echo "（没有匹配到上述关键字）"
          echo ""
          echo "--- 2) 日志最后 50 行 ---"
          tail -50 build.log || echo "（没有日志文件）"
          echo ""
          echo "=========================================="
          echo "完整日志已打包成 build-log 文件，可在本页面右侧『Artifacts』下载用记事本打开"
          echo "=========================================="

      - name: 9. 上传完整构建日志（可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: CatVod/build.log
          if-no-files-found: warn
