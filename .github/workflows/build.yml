name: 编译枫叶影视APK

on:
  push:
分支: [ main ]
  workflow_dispatch: # 支持网页手动触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"
    steps:
      - name: 布置工作
        uses: actions/checkout@v4

      - name: 1. 拉取本仓库（含我们的配置与脚本）
        uses: actions/checkout@v4

      - name: 2. 准备 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 2.1 准备 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 3. 准备 Android SDK（用 runner 预装的）
        uses: android-actions/setup-android@v3

      - name: 4. 克隆CatVod系源码 (XiaoRanLiu3119/TVBoxOS-Mobile 竖屏)
        run: |
          rm -rf Box
          git clone https://github.com/XiaoRanLiu3119/TVBoxOS-Mobile.git Box

      - name: 4.1 补写 local.properties（关键修复）
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > Box/local.properties

      # 竖屏源码无python依赖，注释掉这一段，防止报错
      # - name: 4.2 修复 buildPython 路径并移除 pyquery 依赖
      #   run: echo 跳过python修复

      - name: 5. 烧入枫叶配置
        run: |
          cp -f ./config.json Box/app/src/main/assets/config.json

      - name: 5.1 构建环境诊断
        run: |
          cd Box
          ./gradlew --version

      - name: 6. 编译 Debug APK（自动选模块 + JDK11兜底）
        run: |
          cd Box
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 7. 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: 竖屏TVBox-APK
          path: Box/app/build/outputs/apk/debug/app-debug.apk
