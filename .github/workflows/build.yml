name: 编译枫叶影视APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取本仓库（含我们的配置与脚本）
        uses: actions/checkout@v4

      - name: 2. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. 安装 Android SDK + 构建工具
        uses: android-actions/setup-android@v3
      - name: 3.1 装 SDK 平台/构建工具并同意协议
        run: |
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: 4. 克隆 CatVod 手机版源码（app 模块=竖屏）
        run: git clone --depth 1 https://github.com/FongMi/CatVod

      - name: 5. 烧入枫叶配置（自动改默认配置地址）
        run: bash fengye-catvod/bake.sh CatVod app

      - name: 6. 编译 Debug APK（自动用调试密钥签名，可直接安装）
        working-directory: CatVod
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 7. 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: fengye-app-debug
          path: CatVod/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
